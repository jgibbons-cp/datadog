## Datadog Database Monitoring -- MySQL (orders domain)
init_config:

instances:
  - dbm: true
    host: mysql
    port: 3306
    username: datadog
    password: "%%env_MYSQL_DD_PASSWORD%%"
    # Identifies this database host in DBM. Must be unique per database host.
    reported_hostname: "%%env_DEMO_NAME%%-mysql-prod"
    tags:
      - env:demo
      - account:%%env_DEMO_NAME%%
      - domain:orders
      - db_engine:mysql
    options:
      replication: false
      extra_status_metrics: true
      extra_innodb_metrics: true
      schema_size_metrics: true
      table_size_metrics: true
    query_metrics:
      enabled: true
    query_samples:
      enabled: true
      explained_queries_per_hour_per_query: 60
    query_activity:
      enabled: true
    collect_settings:
      enabled: true
    collect_schemas:
      enabled: true
