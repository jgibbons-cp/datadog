# kind cluster for the __DEMO_BRAND__ demo.
# Three nodes so the Datadog DaemonSet is visibly a DaemonSet. Delete the two
# worker entries if you want a leaner cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: __DEMO_NAME__

nodes:
  - role: control-plane
    extraPortMappings:
      # Storefront + control panel -> http://localhost:8080
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # BFF API, handy for curl-ing during the demo
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
  - role: worker
  - role: worker
