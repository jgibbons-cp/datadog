# ---------------------------------------------------------------------------
# Software Catalog definitions (Entity v3) for the __DEMO_BRAND__ stack.
#
# Register with:  ./k8s/register-catalog.sh
# Or paste individually into Software Catalog -> Add Entity -> Import YAML.
#
# Ownership is deliberately split across three teams so the catalog shows real
# boundaries rather than one undifferentiated blob -- it mirrors how an
# applications org like __DEMO_BRAND__'s actually divides delivery responsibility.
# ---------------------------------------------------------------------------
apiVersion: v3
kind: system
metadata:
  name: __DEMO_NAME__-commerce-system
  displayName: __DEMO_BRAND__ Commerce
  owner: __DEMO_NAME__-storefront
  description: Direct-to-consumer storefront, order management and product catalog.
  tags:
    - env:demo
    - account:__DEMO_NAME__
spec:
  components:
    - service:__DEMO_NAME__-web
    - service:__DEMO_NAME__-bff
    - service:__DEMO_NAME__-orders
    - service:__DEMO_NAME__-catalog
    - datastore:__DEMO_NAME__-mysql
    - datastore:__DEMO_NAME__-postgres
    - datastore:__DEMO_NAME__-redis
---
apiVersion: v3
kind: service
metadata:
  name: __DEMO_NAME__-web
  displayName: Storefront (Browser)
  owner: __DEMO_NAME__-storefront
  description: Customer-facing storefront. Instrumented with Browser RUM and Session Replay.
  tags:
    - env:demo
    - tier:frontend
    - account:__DEMO_NAME__
spec:
  tier: "1"
  lifecycle: production
  type: web
  languages:
    - javascript
  componentOf:
    - system:__DEMO_NAME__-commerce-system
  dependsOn:
    - service:__DEMO_NAME__-bff
---
apiVersion: v3
kind: service
metadata:
  name: __DEMO_NAME__-bff
  displayName: Storefront BFF
  owner: __DEMO_NAME__-storefront
  description: Backend-for-frontend. Aggregates the orders and catalog services for the storefront.
  tags:
    - env:demo
    - tier:backend
    - account:__DEMO_NAME__
spec:
  tier: "1"
  lifecycle: production
  type: web
  languages:
    - javascript
  componentOf:
    - system:__DEMO_NAME__-commerce-system
  dependsOn:
    - service:__DEMO_NAME__-orders
    - service:__DEMO_NAME__-catalog
    - datastore:__DEMO_NAME__-redis
---
apiVersion: v3
kind: service
metadata:
  name: __DEMO_NAME__-orders
  displayName: Order Management
  owner: __DEMO_NAME__-commerce
  description: Order capture, inventory reservation and revenue analytics. Business critical.
  tags:
    - env:demo
    - tier:backend
    - domain:orders
    - account:__DEMO_NAME__
spec:
  tier: "1"
  lifecycle: production
  type: web
  languages:
    - java
  componentOf:
    - system:__DEMO_NAME__-commerce-system
  dependsOn:
    - datastore:__DEMO_NAME__-mysql
    - datastore:__DEMO_NAME__-redis
---
apiVersion: v3
kind: service
metadata:
  name: __DEMO_NAME__-catalog
  displayName: Product Catalog
  owner: __DEMO_NAME__-data
  description: Product, review and browse-analytics APIs backed by PostgreSQL.
  tags:
    - env:demo
    - tier:backend
    - domain:catalog
    - account:__DEMO_NAME__
spec:
  tier: "2"
  lifecycle: production
  type: web
  languages:
    - python
  componentOf:
    - system:__DEMO_NAME__-commerce-system
  dependsOn:
    - datastore:__DEMO_NAME__-postgres
    - datastore:__DEMO_NAME__-redis
---
apiVersion: v3
kind: datastore
metadata:
  name: __DEMO_NAME__-mysql
  displayName: Orders Database (MySQL)
  owner: __DEMO_NAME__-commerce
  description: MySQL 8 holding customers, orders, order items and inventory.
  tags:
    - env:demo
    - db_engine:mysql
    - domain:orders
    - account:__DEMO_NAME__
spec:
  tier: "1"
  lifecycle: production
  type: mysql
  componentOf:
    - system:__DEMO_NAME__-commerce-system
---
apiVersion: v3
kind: datastore
metadata:
  name: __DEMO_NAME__-postgres
  displayName: Catalog Database (PostgreSQL)
  owner: __DEMO_NAME__-data
  description: PostgreSQL 16 holding products, reviews and product view analytics.
  tags:
    - env:demo
    - db_engine:postgresql
    - domain:catalog
    - account:__DEMO_NAME__
spec:
  tier: "2"
  lifecycle: production
  type: postgres
  componentOf:
    - system:__DEMO_NAME__-commerce-system
---
apiVersion: v3
kind: datastore
metadata:
  name: __DEMO_NAME__-redis
  displayName: Shared Cache (Redis)
  owner: __DEMO_NAME__-storefront
  description: Feature flags and shared runtime configuration for the storefront.
  tags:
    - env:demo
    - db_engine:redis
    - account:__DEMO_NAME__
spec:
  tier: "3"
  lifecycle: production
  type: redis
  componentOf:
    - system:__DEMO_NAME__-commerce-system
