# Datadog Helm values tuned for a kind cluster running on Colima.
# Install with:
#   helm install datadog datadog/datadog -n datadog --create-namespace -f k8s/datadog-values.yaml

datadog:
  # DD_SITE and the API key come from the datadog-secret created by deploy.sh
  site: datadoghq.com
  apiKeyExistingSecret: datadog-secret
  clusterName: __DEMO_NAME__-kind

  # Database credentials for the DBM checks, referenced from the pod annotations
  # as %%env_MYSQL_DD_PASSWORD%% / %%env_POSTGRES_DD_PASSWORD%% so they never
  # appear in plaintext in a pod spec.
  envFrom:
    - secretRef:
        name: __DEMO_NAME__-dbm

  tags:
    - "env:demo"
    - "account:__DEMO_NAME__"
    - "demo:d2c"

  # kind's kubelet serving certificate does not carry the node IP as a SAN, so
  # the agent cannot verify it. Without this the kubelet check fails on every
  # node and you lose container metrics.
  kubelet:
    tlsVerify: false

  # kind runs containerd, not dockershim.
  criSocketPath: /run/containerd/containerd.sock

  apm:
    portEnabled: true        # trace intake on the node's :8126
    socketEnabled: true

  logs:
    enabled: true
    containerCollectAll: true
    containerCollectUsingFiles: true

  processAgent:
    # 'enabled' is deprecated; processCollection is the current key.
    processCollection: true
    containerCollection: true

  dogstatsd:
    port: 8125
    useHostPort: true
    nonLocalTraffic: true

  orchestratorExplorer:
    enabled: true            # Kubernetes resource views in Datadog

  networkMonitoring:
    enabled: false           # needs a kernel the kind node image may not expose

  # Database Monitoring is configured per-pod via ad.datadoghq.com annotations
  # on the mysql and postgres StatefulSets, so nothing is needed here.
  confd: {}

clusterAgent:
  enabled: true
  replicas: 1
  metricsProvider:
    enabled: false
  admissionController:
    # Nothing here relies on library or agent-host injection, and disabling it
    # removes a webhook that can block pod creation if the cluster agent is down.
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits:   { cpu: 500m, memory: 512Mi }

clusterChecksRunner:
  enabled: false

agents:
  # kind only removes the control-plane taint on single-node clusters. This
  # cluster has three nodes, so without this toleration the DaemonSet lands on
  # 2 of 3 nodes and you lose all data from the control-plane node.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    agent:
      resources:
        requests: { cpu: 150m, memory: 256Mi }
        limits:   { cpu: "1",  memory: 768Mi }
    traceAgent:
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits:   { cpu: "1",  memory: 512Mi }
    processAgent:
      resources:
        requests: { cpu: 50m,  memory: 128Mi }
        limits:   { cpu: 500m, memory: 384Mi }
