apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: __DEMO_NAME__
  labels:
    app: bff
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
        tier: backend
        tags.datadoghq.com/env: demo
        tags.datadoghq.com/service: __DEMO_NAME__-bff
        tags.datadoghq.com/version: 1.4.0
      annotations:
        ad.datadoghq.com/bff.logs: '[{"source": "nodejs", "service": "__DEMO_NAME__-bff"}]'
    spec:
      # Kubernetes injects legacy Docker-link env vars for every Service in the
      # namespace (REDIS_PORT=tcp://10.96.x.x:6379 and friends), which shadow
      # application variables of the same name. Turn the whole mechanism off.
      enableServiceLinks: false
      containers:
      - name: bff
        image: __DEMO_NAME__/bff:1.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: PORT
          value: '3000'
        - name: ORDERS_URL
          value: http://orders:8080
        - name: CATALOG_URL
          value: http://catalog:8000
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: '6379'
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_ENV
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/env']
        - name: DD_SERVICE
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/service']
        - name: DD_VERSION
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/version']
        - name: DD_TRACE_AGENT_PORT
          value: '8126'
        # Ownership, surfaced on every span, metric and log line.
        - name: DD_TAGS
          value: team:__DEMO_NAME__-storefront
        - name: DD_LOGS_INJECTION
          value: 'true'
        - name: DD_PROFILING_ENABLED
          value: 'true'
        - name: DD_TRACE_SAMPLE_RATE
          value: '1'
        resources:
          requests:
            cpu: 150m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: __DEMO_NAME__
spec:
  selector:
    app: bff
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: bff-nodeport
  namespace: __DEMO_NAME__
spec:
  type: NodePort
  selector:
    app: bff
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30300
