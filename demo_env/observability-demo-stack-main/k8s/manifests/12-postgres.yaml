apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: __DEMO_NAME__
  labels:
    app: postgres
    tier: database
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: __DEMO_NAME__
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
        tags.datadoghq.com/env: demo
        tags.datadoghq.com/service: __DEMO_NAME__-postgres
      annotations:
      # Database Monitoring, discovered by the node agent on this pod. The
      # password resolves from the agent's own environment via
      # %%env_POSTGRES_DD_PASSWORD%%, so it never appears in this pod spec.
        ad.datadoghq.com/postgres.checks: |
          {
            "postgres": {
              "init_config": {},
              "instances": [
                {
                  "dbm": true,
                  "host": "%%host%%",
                  "port": 5432,
                  "username": "datadog",
                  "password": "%%env_POSTGRES_DD_PASSWORD%%",
                  "dbname": "__DEMO_NAME___catalog",
                  "reported_hostname": "__DEMO_NAME__-postgres-prod",
                  "tags": [
                    "env:demo",
                    "account:__DEMO_NAME__",
                    "team:__DEMO_NAME__-data",
                    "domain:catalog",
                    "db_engine:postgresql"
                  ],
                  "relations": [
                    {
                      "relation_regex": ".*",
                      "relkind": [
                        "r",
                        "i"
                      ]
                    }
                  ],
                  "query_metrics": {
                    "enabled": true
                  },
                  "query_samples": {
                    "enabled": true
                  },
                  "query_activity": {
                    "enabled": true
                  },
                  "collect_settings": {
                    "enabled": true
                  },
                  "collect_schemas": {
                    "enabled": true
                  }
                }
              ]
            }
          }
    spec:
      # Kubernetes injects legacy Docker-link env vars for every Service in the
      # namespace (REDIS_PORT=tcp://10.96.x.x:6379 and friends), which shadow
      # application variables of the same name. Turn the whole mechanism off.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: postgres
        image: postgres:16
        args:
        - postgres
        - -c
        - shared_preload_libraries=pg_stat_statements
        - -c
        - pg_stat_statements.track=all
        - -c
        - pg_stat_statements.max=10000
        - -c
        - track_activity_query_size=4096
        - -c
        - track_io_timing=on
        - -c
        - max_connections=200
        - -c
        - log_min_duration_statement=100
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: __DEMO_NAME___catalog
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __DEMO_NAME__-db
              key: POSTGRES_ROOT_PASSWORD
        - name: POSTGRES_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __DEMO_NAME__-db
              key: POSTGRES_APP_PASSWORD
        - name: POSTGRES_DD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __DEMO_NAME__-db
              key: POSTGRES_DD_PASSWORD
        ports:
        - name: postgres
          containerPort: 5432
        volumeMounts:
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 3Gi
        # -h 127.0.0.1 is essential. The entrypoint's temporary init server listens
        # on the Unix socket only, so a socket-based pg_isready would pass during
        # seeding, enable the liveness probe, and get the pod killed mid-seed --
        # after which the entrypoint skips initdb forever and the data never lands.
        startupProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -p
            - '5432'
            - -U
            - postgres
            - -d
            - __DEMO_NAME___catalog
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 180
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -p
            - '5432'
            - -U
            - postgres
            - -d
            - __DEMO_NAME___catalog
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 5432
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: initdb
        configMap:
          name: postgres-init
          defaultMode: 493
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
