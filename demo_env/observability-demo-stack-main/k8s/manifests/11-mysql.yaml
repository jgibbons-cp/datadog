apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: __DEMO_NAME__
  labels:
    app: mysql
    tier: database
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: __DEMO_NAME__
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        tier: database
        tags.datadoghq.com/env: demo
        tags.datadoghq.com/service: __DEMO_NAME__-mysql
      annotations:
      # Database Monitoring, discovered by the node agent on this pod. The
      # password resolves from the agent's own environment via
      # %%env_MYSQL_DD_PASSWORD%%, so it never appears in this pod spec.
        ad.datadoghq.com/mysql.checks: |
          {
            "mysql": {
              "init_config": {},
              "instances": [
                {
                  "dbm": true,
                  "host": "%%host%%",
                  "port": 3306,
                  "username": "datadog",
                  "password": "%%env_MYSQL_DD_PASSWORD%%",
                  "reported_hostname": "__DEMO_NAME__-mysql-prod",
                  "tags": [
                    "env:demo",
                    "account:__DEMO_NAME__",
                    "team:__DEMO_NAME__-commerce",
                    "domain:orders",
                    "db_engine:mysql"
                  ],
                  "options": {
                    "replication": false,
                    "extra_status_metrics": true,
                    "extra_innodb_metrics": true,
                    "schema_size_metrics": true
                  },
                  "query_metrics": {
                    "enabled": true
                  },
                  "query_samples": {
                    "enabled": true
                  },
                  "query_activity": {
                    "enabled": true
                  },
                  "collect_settings": {
                    "enabled": true
                  },
                  "collect_schemas": {
                    "enabled": true
                  }
                }
              ]
            }
          }
    spec:
      # Kubernetes injects legacy Docker-link env vars for every Service in the
      # namespace (REDIS_PORT=tcp://10.96.x.x:6379 and friends), which shadow
      # application variables of the same name. Turn the whole mechanism off.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: mysql
        image: mysql:8.0
        args:
        - --performance-schema=ON
        - --performance-schema-consumer-events-statements-current=ON
        - --performance-schema-consumer-events-waits-current=ON
        - --performance-schema-consumer-events-statements-history-long=ON
        - --performance-schema-max-digest-length=4096
        - --max-digest-length=4096
        - --max-connections=200
        - --innodb-buffer-pool-size=512M
        - --slow-query-log=ON
        - --long-query-time=0.1
        env:
        - name: MYSQL_DATABASE
          value: __DEMO_NAME___orders
        - name: MYSQL_USER
          value: __DEMO_NAME__
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __DEMO_NAME__-db
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __DEMO_NAME__-db
              key: MYSQL_APP_PASSWORD
        - name: MYSQL_DD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __DEMO_NAME__-db
              key: MYSQL_DD_PASSWORD
        ports:
        - name: mysql
          containerPort: 3306
        volumeMounts:
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
        - name: data
          mountPath: /var/lib/mysql
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 3Gi
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 180
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 3306
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: initdb
        configMap:
          name: mysql-init
          # 493 == 0755. 03-datadog.sh must keep its executable bit through the
          # ConfigMap symlink indirection, or the entrypoint sources it instead.
          defaultMode: 493
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
