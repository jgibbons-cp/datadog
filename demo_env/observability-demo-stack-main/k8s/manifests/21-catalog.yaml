apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: __DEMO_NAME__
  labels:
    app: catalog
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        tier: backend
        tags.datadoghq.com/env: demo
        tags.datadoghq.com/service: __DEMO_NAME__-catalog
        tags.datadoghq.com/version: 1.4.0
      annotations:
        ad.datadoghq.com/catalog.logs: '[{"source": "python", "service": "__DEMO_NAME__-catalog"}]'
    spec:
      # Kubernetes injects legacy Docker-link env vars for every Service in the
      # namespace (REDIS_PORT=tcp://10.96.x.x:6379 and friends), which shadow
      # application variables of the same name. Turn the whole mechanism off.
      enableServiceLinks: false
      containers:
      - name: catalog
        image: __DEMO_NAME__/catalog:1.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: PGHOST
          value: postgres
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: __DEMO_NAME___catalog
        - name: PGUSER
          value: __DEMO_NAME__
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: __DEMO_NAME__-db
              key: POSTGRES_APP_PASSWORD
        - name: DB_POOL_MAX
          value: '10'
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: '6379'
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_ENV
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/env']
        - name: DD_SERVICE
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/service']
        - name: DD_VERSION
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/version']
        - name: DD_TRACE_AGENT_PORT
          value: '8126'
        # Ownership, surfaced on every span, metric and log line.
        - name: DD_TAGS
          value: team:__DEMO_NAME__-data
        - name: DD_LOGS_INJECTION
          value: 'true'
        - name: DD_PROFILING_ENABLED
          value: 'true'
        - name: DD_DBM_PROPAGATION_MODE
          value: full
        - name: DD_TRACE_SAMPLE_RATE
          value: '1'
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: __DEMO_NAME__
spec:
  selector:
    app: catalog
  ports:
  - name: http
    port: 8000
    targetPort: 8000
