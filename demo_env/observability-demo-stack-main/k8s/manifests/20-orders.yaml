apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: __DEMO_NAME__
  labels:
    app: orders
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        tier: backend
        tags.datadoghq.com/env: demo
        tags.datadoghq.com/service: __DEMO_NAME__-orders
        tags.datadoghq.com/version: 1.4.0
      annotations:
        ad.datadoghq.com/orders.logs: '[{"source": "java", "service": "__DEMO_NAME__-orders"}]'
    spec:
      # Kubernetes injects legacy Docker-link env vars for every Service in the
      # namespace (REDIS_PORT=tcp://10.96.x.x:6379 and friends), which shadow
      # application variables of the same name. Turn the whole mechanism off.
      enableServiceLinks: false
      containers:
      - name: orders
        image: __DEMO_NAME__/orders:1.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: MYSQL_HOST
          value: mysql
        - name: MYSQL_PORT
          value: '3306'
        - name: MYSQL_DB
          value: __DEMO_NAME___orders
        - name: MYSQL_USER
          value: __DEMO_NAME__
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __DEMO_NAME__-db
              key: MYSQL_APP_PASSWORD
        - name: DB_POOL_MAX
          value: '10'
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: '6379'
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_ENV
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/env']
        - name: DD_SERVICE
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/service']
        - name: DD_VERSION
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/version']
        - name: DD_TRACE_AGENT_PORT
          value: '8126'
        # Ownership, surfaced on every span, metric and log line.
        - name: DD_TAGS
          value: team:__DEMO_NAME__-commerce
        - name: DD_LOGS_INJECTION
          value: 'true'
        - name: DD_PROFILING_ENABLED
          value: 'true'
        - name: DD_DBM_PROPAGATION_MODE
          value: full
        - name: DD_TRACE_SAMPLE_RATE
          value: '1'
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 20
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: __DEMO_NAME__
spec:
  selector:
    app: orders
  ports:
  - name: http
    port: 8080
    targetPort: 8080
