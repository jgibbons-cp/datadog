# Rollback / demo reset: removes the index so the scenario can be run again.
#   kubectl delete job orders-drop-customer-email-index -n __DEMO_NAME__ --ignore-not-found
#   kubectl apply -f k8s/manifests/91-index-rollback-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: orders-drop-customer-email-index
  namespace: __DEMO_NAME__
  labels:
    app: orders-migration
    change: drop-index-orders-customer-email
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: orders-migration
        tags.datadoghq.com/env: demo
        tags.datadoghq.com/service: __DEMO_NAME__-orders
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: MYSQL_HOST, value: mysql }
            - { name: MYSQL_DB,   value: __DEMO_NAME___orders }
            - { name: MYSQL_USER, value: __DEMO_NAME__ }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: __DEMO_NAME__-db, key: MYSQL_APP_PASSWORD } }
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mysql -h "$MYSQL_HOST" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DB" <<'SQL'
              SET @exists := (
                SELECT COUNT(*) FROM information_schema.statistics
                WHERE table_schema = DATABASE()
                  AND table_name   = 'orders'
                  AND index_name   = 'idx_orders_customer_email'
              );
              SET @ddl := IF(@exists > 0,
                'ALTER TABLE orders DROP INDEX idx_orders_customer_email, ALGORITHM=INPLACE, LOCK=NONE',
                'DO 0');
              PREPARE stmt FROM @ddl;
              EXECUTE stmt;
              DEALLOCATE PREPARE stmt;
              SELECT IF(@exists > 0, 'dropped', 'already absent') AS result;
              SQL
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
