name: ${DEMO_NAME}-demo

services:
  # ---------------------------------------------------------------- databases
  mysql:
    image: mysql:8.0
    container_name: ${DEMO_NAME}-mysql
    command: >
      --performance-schema=ON
      --performance-schema-consumer-events-statements-current=ON
      --performance-schema-consumer-events-waits-current=ON
      --performance-schema-consumer-events-statements-history-long=ON
      --performance-schema-max-digest-length=4096
      --max-digest-length=4096
      --max-connections=200
      --innodb-buffer-pool-size=256M
      --slow-query-log=ON
      --long-query-time=0.1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DEMO_NAME}_orders
      MYSQL_USER: ${DEMO_NAME}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_DD_PASSWORD: ${MYSQL_DD_PASSWORD}
    volumes:
      - ./db/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    labels:
      com.datadoghq.tags.env: "demo"
      com.datadoghq.tags.service: "${DEMO_NAME}-mysql"
    networks: [demo-net]

  postgres:
    image: postgres:16
    container_name: ${DEMO_NAME}-postgres
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c track_activity_query_size=4096
      -c track_io_timing=on
      -c max_connections=200
      -c log_min_duration_statement=100
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: ${DEMO_NAME}_catalog
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_DD_PASSWORD: ${POSTGRES_DD_PASSWORD}
    volumes:
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DEMO_NAME}_catalog"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    labels:
      com.datadoghq.tags.env: "demo"
      com.datadoghq.tags.service: "${DEMO_NAME}-postgres"
    networks: [demo-net]

  redis:
    image: redis:7-alpine
    container_name: ${DEMO_NAME}-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [demo-net]

  # ------------------------------------------------------------ datadog agent
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: ${DEMO_NAME}-datadog-agent
    pid: host
    cgroup: host
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE}
      DD_HOSTNAME: ${DEMO_NAME}-demo-host
      DEMO_NAME: ${DEMO_NAME}
      DD_ENV: demo
      DD_TAGS: "env:demo account:${DEMO_NAME} demo:d2c"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:${DEMO_NAME}-datadog-agent"
      DD_PROCESS_AGENT_ENABLED: "true"
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "true"
      DD_DBM_PROPAGATION_MODE: "full"
      # consumed by the DBM check configs via %%env_...%% templating
      MYSQL_DD_PASSWORD: ${MYSQL_DD_PASSWORD}
      POSTGRES_DD_PASSWORD: ${POSTGRES_DD_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - ./agent/conf.d/mysql.d/conf.yaml:/etc/datadog-agent/conf.d/mysql.d/conf.yaml:ro
      - ./agent/conf.d/postgres.d/conf.yaml:/etc/datadog-agent/conf.d/postgres.d/conf.yaml:ro
    ports:
      - "8126:8126"      # APM trace intake
      - "8125:8125/udp"  # DogStatsD
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [demo-net]

  # ---------------------------------------------------------------- services
  orders:
    build: ./services/orders
    container_name: ${DEMO_NAME}-orders
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${DEMO_NAME}_orders
      MYSQL_USER: ${DEMO_NAME}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_DD_PASSWORD: ${MYSQL_DD_PASSWORD}
      DB_POOL_MAX: "10"
      REDIS_HOST: redis
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: "8126"
      DD_SERVICE: ${DEMO_NAME}-orders
      DD_ENV: demo
      DD_TAGS: "team:${DEMO_NAME}-commerce"
      DD_VERSION: "1.4.0"
      DD_LOGS_INJECTION: "true"
      DD_PROFILING_ENABLED: "true"
      DD_DBM_PROPAGATION_MODE: "full"
      DD_TRACE_SAMPLE_RATE: "1"
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      com.datadoghq.tags.env: "demo"
      com.datadoghq.tags.service: "${DEMO_NAME}-orders"
      com.datadoghq.tags.version: "1.4.0"
    networks: [demo-net]

  catalog:
    build: ./services/catalog
    container_name: ${DEMO_NAME}-catalog
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DEMO_NAME}_catalog
      PGUSER: ${DEMO_NAME}
      PGPASSWORD: ${POSTGRES_APP_PASSWORD}
      DB_POOL_MAX: "10"
      REDIS_HOST: redis
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: "8126"
      DD_SERVICE: ${DEMO_NAME}-catalog
      DD_ENV: demo
      DD_TAGS: "team:${DEMO_NAME}-data"
      DD_VERSION: "1.4.0"
      DD_LOGS_INJECTION: "true"
      DD_PROFILING_ENABLED: "true"
      DD_DBM_PROPAGATION_MODE: "full"
      DD_TRACE_SAMPLE_RATE: "1"
    ports:
      - "8082:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      com.datadoghq.tags.env: "demo"
      com.datadoghq.tags.service: "${DEMO_NAME}-catalog"
      com.datadoghq.tags.version: "1.4.0"
    networks: [demo-net]

  bff:
    build: ./services/bff
    container_name: ${DEMO_NAME}-bff
    environment:
      PORT: "3000"
      ORDERS_URL: http://orders:8080
      CATALOG_URL: http://catalog:8000
      REDIS_HOST: redis
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: "8126"
      DD_SERVICE: ${DEMO_NAME}-bff
      DD_ENV: demo
      DD_TAGS: "team:${DEMO_NAME}-storefront"
      DD_VERSION: "1.4.0"
      DD_LOGS_INJECTION: "true"
      DD_PROFILING_ENABLED: "true"
      DD_TRACE_SAMPLE_RATE: "1"
    ports:
      - "3000:3000"
    depends_on:
      orders:
        condition: service_started
      catalog:
        condition: service_started
      redis:
        condition: service_healthy
    labels:
      com.datadoghq.tags.env: "demo"
      com.datadoghq.tags.service: "${DEMO_NAME}-bff"
      com.datadoghq.tags.version: "1.4.0"
    networks: [demo-net]

  web:
    build: ./services/web
    container_name: ${DEMO_NAME}-web
    environment:
      DEMO_BRAND: ${DEMO_BRAND}
      DD_RUM_APPLICATION_ID: ${DD_RUM_APPLICATION_ID}
      DD_RUM_CLIENT_TOKEN: ${DD_RUM_CLIENT_TOKEN}
      DD_SITE: ${DD_SITE}
    ports:
      - "8080:80"
    depends_on:
      bff:
        condition: service_started
    labels:
      com.datadoghq.tags.env: "demo"
      com.datadoghq.tags.service: "${DEMO_NAME}-web"
    networks: [demo-net]

  loadgen:
    build: ./loadgen
    container_name: ${DEMO_NAME}-loadgen
    environment:
      TARGET: http://bff:3000
      CONCURRENCY: "6"
      THINK_TIME_MS: "700"
    depends_on:
      bff:
        condition: service_started
    restart: unless-stopped
    networks: [demo-net]

volumes:
  mysql-data:
  postgres-data:

networks:
  demo-net:
    driver: bridge
