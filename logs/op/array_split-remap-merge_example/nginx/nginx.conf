events {
    worker_connections 1024;
}

http {
    upstream opw_pool {
        # Consistent ketama ring — same X-Record-ID always routes to same upstream.
        # When an instance goes down, only its keys remap; others stay put.
        hash $http_x_record_id consistent;
        server opw1:8282 max_fails=1 fail_timeout=5s;
        server opw2:8282 max_fails=1 fail_timeout=5s;
        server opw3:8282 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass         http://opw_pool;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Record-ID     $http_x_record_id;
            proxy_set_header   DD-API-KEY      $http_dd_api_key;
            proxy_connect_timeout 2s;
            proxy_read_timeout    10s;

            # Expose which OPW instance handled this request — used by fail-scenario.sh
            add_header X-OPW-Upstream $upstream_addr always;
        }
    }
}
